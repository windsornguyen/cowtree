name: SQLite metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    name: SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.97.1 fmt --all --check
      - name: Lint
        run: cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test crashes and concurrent publication
        run: cargo +1.97.1 test --locked --workspace --all-targets --all-features
      - name: Run production example with test hooks disabled
        run: cargo +1.97.1 run --locked -p cowtree-metadata --example publish
        env:
          COWTREE_CRASH_AT: after-sql-commit
          COWTREE_PAUSE_AT: after-upload-pin
      - name: Check documentation
        run: cargo +1.97.1 doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  minimum-rust:
    name: SQLite minimum Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check minimum supported compiler
        run: cargo +1.85.0 check --locked --workspace --all-targets --all-features
