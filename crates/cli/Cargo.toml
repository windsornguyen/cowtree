[package]
name = "cowtree-cli"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cowtree"
path = "src/main.rs"

[[bin]]
name = "git-cowtree"
path = "src/git_main.rs"

[dependencies]
cowtree = { package = "libcowtree", path = "../libcowtree" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
cowtree-workspace = { path = "../workspace" }
cowtree-metadata = { path = "../metadata" }
cowtree-process = { path = "../process" }

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[features]
fault-injection = ["cowtree-workspace/fault-injection", "cowtree-metadata/fault-injection"]

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
