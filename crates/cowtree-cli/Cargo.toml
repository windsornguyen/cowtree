[package]
name = "cowtree-cli"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cowtree"
path = "src/main.rs"

[[bin]]
name = "git-cowtree"
path = "src/git_main.rs"

[dependencies]
cowtree = { package = "libcowtree", path = "../libcowtree" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }

[lints]
workspace = true
