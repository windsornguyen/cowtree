[package]
name = "cowtree-python"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_libcowtree"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
cowtree = { package = "libcowtree", path = "../libcowtree" }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde = "1"
serde_json = "1"

[lints]
workspace = true
