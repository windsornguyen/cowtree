[package]
name = "libcowtree"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "cowtree"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
cowtree-git = { path = "../git" }
same-file = "1"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
dunce = "1.0.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices"] }

[lints]
workspace = true
