[package]
name = "cowtree-workspace"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cowtree = { package = "libcowtree", path = "../libcowtree" }
cowtree-metadata = { path = "../metadata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4"] }
fs4 = "1.1"
cowtree-git = { path = "../git" }
rustix = { version = "1.1", features = ["fs", "process"] }

[lints]
workspace = true

[features]
fault-injection = ["cowtree-metadata/fault-injection"]
