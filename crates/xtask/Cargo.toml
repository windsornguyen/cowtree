[package]
name = "xtask"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
regex = "1"
percent-encoding = "2"
wait-timeout = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }

[lints]
workspace = true
