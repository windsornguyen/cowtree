[build-system]
requires = ["hatchling>=1.25", "inline-tests>=0.1.0"]
build-backend = "hatchling.build"

[project]
name = "cowtree"
version = "0.0.1"
description = "Copy-on-write git worktrees for AI agent fleets"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Windsor Nguyen" }]
keywords = ["git", "worktree", "copy-on-write", "cow", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
]

[project.scripts]
cowtree = "cowtree.cli:main"
git-cowtree = "cowtree.cli:main"

[project.optional-dependencies]
bench = ["matplotlib>=3.9"]

[dependency-groups]
bench = ["matplotlib>=3.9"]
test = [
    "inline-tests>=0.1.0",
    "pytest>=8.0.0",
]
lint = [
    "prek>=0.3.0",
    "ruff>=0.14.0",
    "ty>=0.0.13",
]
dev = [
    { include-group = "bench" },
    { include-group = "lint" },
    { include-group = "test" },
]

[project.urls]
Homepage = "https://github.com/windsornguyen/cowtree"
Repository = "https://github.com/windsornguyen/cowtree"
Issues = "https://github.com/windsornguyen/cowtree/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cowtree"]

[tool.hatch.build.hooks.inline_tests]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--inline-tests", "--strict-config", "--strict-markers", "--tb=short"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build/", "dist/", ".venv/", "__pycache__/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "N",
    "ANN",
    "S",
    "PERF",
    "PLR0913",
    "ARG",
    "PT",
    "RET",
]
ignore = [
    "ANN401",
    "COM812",
    "ISC001",
    "RET504",
    "S101",
    "T201",
]

[tool.ruff.lint.isort]
known-first-party = ["cowtree"]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 25

[tool.ty.environment]
root = ["src", "benchmarks", "."]
python-version = "3.10"

[tool.ty.rules]
invalid-assignment = "error"
invalid-return-type = "error"
invalid-argument-type = "error"
missing-argument = "error"
too-many-positional-arguments = "error"
unresolved-reference = "error"
invalid-base = "error"
conflicting-metaclass = "error"
subclass-of-final-class = "error"
undefined-reveal = "warn"
division-by-zero = "ignore"
unused-ignore-comment = "ignore"

[tool.ty.terminal]
output-format = "concise"
error-on-warning = false
