\* Inductiveness check: INIT is the invariant itself, one step, invariant must hold.
\* Use breadth-first mode without -dfid; this larger instance is not in CI.
INIT Inv
NEXT Next
CONSTANTS
  Leaves = {l1}
  Paths = {p1, p2}
  Values = {v0, v1}
  MaxNodes = 2
  None = None
INVARIANTS Inv
CHECK_DEADLOCK FALSE
