\* Inductiveness check: INIT is the invariant itself, one step, invariant must hold.
\* Use breadth-first mode without -dfid; check_specs.py selects this instance.
INIT Inv
NEXT Next
CONSTANTS
  Leaves = {l1, l2}
  Paths = {p1}
  Values = {v0, v1}
  MaxNodes = 2
  None = None
INVARIANTS Inv
CHECK_DEADLOCK FALSE
