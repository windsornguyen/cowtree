\* Expected to FAIL: the counterexample TLC prints is a witness that a proposal
\* with a stale base epoch commits cleanly. Freshness is not required; leases are.
SPECIFICATION Spec
CONSTANTS
  Leaves = {l1, l2}
  Paths = {p1, p2}
  Values = {v0, v1}
  MaxEpochs = 3
  MaxToken = 2
  None = None
CONSTRAINT TokenBound
INVARIANTS NoStaleBaseCommit ConflictFreeWithoutExpiryOrRogue
CHECK_DEADLOCK FALSE
